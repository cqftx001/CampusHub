spring:
  application:
    name: campushub
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campushub}
    username: ${PGDB_USERNAME:campushub}
    password: ${PGDB_PASSWORD:campushub}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 42MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    test-connection: true
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
campushub:
  oss:
    enabled: ${OSS_ENABLED:true}
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:us-west-1}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}

  auth:
    jwt:
      issuer: ${JWT_ISSUER:campushub}
      secret: ${JWT_SECRET:Y2FtcHVzaHViLWRldi1qd3Qtc2VjcmV0LWNoYW5nZS1tZQ==}
      audience: ${JWT_AUDIENCE:campushub-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

    login-rate-limit:
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
      identifier-max-failures: ${LOGIN_IDENTIFIER_MAX_FAILURES:5}
      ip-max-failures: ${LOGIN_IP_MAX_FAILURES:50}

    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:15m}
      request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:60s}
      reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
      from-address: ${MAIL_FROM_ADDRESS:no-reply@campushub.local}

    email-verification:
      token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
      resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:60s}
      verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
      from-address: ${MAIL_FROM_ADDRESS:no-reply@campushub.local}

    login-session:
      ttl: ${LOGIN_SESSION_TTL:30d}

    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
server:
  port: 8080
